# Grafana's sidecar (grafana-sc-dashboard, NAMESPACE=ALL) watches every
# namespace for ConfigMaps labeled grafana_dashboard=1 and loads them without
# a manual import - this ships the first washflow-api dashboard (HTTP
# traffic/errors/latency, HikariCP pool, JVM) straight from GitOps, backed by
# the metrics the ServiceMonitor already scrapes (servicemonitor.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: washflow-api-dashboard
  labels:
    grafana_dashboard: "1"
data:
  washflow-api.json: |
    {
      "title": "Washflow API",
      "uid": "washflow-api",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "refresh": 1,
            "hide": 0,
            "regex": "",
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request rate by route",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (route) (rate(http_server_requests_seconds_count{application=\"washflow\"}[$__rate_interval]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error rate (5xx)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "100 * sum(rate(http_server_requests_seconds_count{application=\"washflow\",status=~\"5..\"}[$__rate_interval])) / sum(rate(http_server_requests_seconds_count{application=\"washflow\"}[$__rate_interval]))",
              "legendFormat": "5xx %"
            }
          ]
        },
        {
          "id": 3,
          "title": "Average latency by route (ms)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "1000 * sum by (route) (rate(http_server_requests_seconds_sum{application=\"washflow\"}[$__rate_interval])) / sum by (route) (rate(http_server_requests_seconds_count{application=\"washflow\"}[$__rate_interval]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Max observed latency by route (ms)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "1000 * http_server_requests_seconds_max{application=\"washflow\"}",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Database pool (HikariCP)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "hikaricp_connections_active{application=\"washflow\"}",
              "legendFormat": "active"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "hikaricp_connections_idle{application=\"washflow\"}",
              "legendFormat": "idle"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "hikaricp_connections_pending{application=\"washflow\"}",
              "legendFormat": "pending"
            }
          ]
        },
        {
          "id": 6,
          "title": "Connection acquire time (ms)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "1000 * rate(hikaricp_connections_acquire_seconds_sum{application=\"washflow\"}[$__rate_interval]) / rate(hikaricp_connections_acquire_seconds_count{application=\"washflow\"}[$__rate_interval])",
              "legendFormat": "avg acquire"
            }
          ]
        },
        {
          "id": 7,
          "title": "JVM heap used vs max",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "jvm_memory_used_bytes{application=\"washflow\",area=\"heap\"}",
              "legendFormat": "used - {{id}}"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "jvm_memory_max_bytes{application=\"washflow\",area=\"heap\"}",
              "legendFormat": "max - {{id}}"
            }
          ]
        },
        {
          "id": 8,
          "title": "JVM threads live",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 12, "y": 24, "w": 6, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "jvm_threads_live_threads{application=\"washflow\"}",
              "legendFormat": "threads"
            }
          ]
        },
        {
          "id": 9,
          "title": "Process CPU usage",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 18, "y": 24, "w": 6, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "process_cpu_usage{application=\"washflow\"}",
              "legendFormat": "cpu"
            }
          ]
        },
        {
          "id": 10,
          "title": "GC pause rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 0, "y": 32, "w": 24, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "rate(jvm_gc_pause_seconds_sum{application=\"washflow\"}[$__rate_interval])",
              "legendFormat": "{{action}}"
            }
          ]
        }
      ]
    }
