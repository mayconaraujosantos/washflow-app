apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: washflow-api
spec:
  ingressClassName: nginx
  rules:
    - host: washflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: washflow-api
                port:
                  name: http
    # No `host`: catches requests with no matching Host header (e.g. a
    # tablet/phone hitting the LAN IP directly, which can't easily get a
    # washflow.local /etc/hosts entry), so the app is still reachable there.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: washflow-api
                port:
                  name: http
