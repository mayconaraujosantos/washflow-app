# Local-cluster values only - never reuse them outside kind.
apiVersion: v1
kind: Secret
metadata:
  name: washflow
type: Opaque
stringData:
  DB_USER: washflow
  DB_PASSWORD: washflow-local
  AUTH_TOKEN_SECRET: local-cluster-only-auth-token-secret-0123456789
  # Bearer token for GET /api/metrics; the ServiceMonitor sends the same value.
  METRICS_TOKEN: local-cluster-only-metrics-token
  # WhatsApp access codes through the Evolution API pod (evolution.yaml). The API
  # key is also the Evolution server's global key; link the number by QR code
  # before the codes go out (infra/README.md, "WhatsApp").
  OTP_CHANNEL: evolution
  EVOLUTION_URL: http://washflow-evolution:8080
  EVOLUTION_INSTANCE: washflow
  EVOLUTION_API_KEY: local-cluster-only-evolution-api-key
