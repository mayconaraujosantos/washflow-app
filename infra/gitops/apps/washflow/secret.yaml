# Local-cluster values only - never reuse them outside kind.
apiVersion: v1
kind: Secret
metadata:
  name: washflow
type: Opaque
stringData:
  DB_USER: washflow
  DB_PASSWORD: washflow-local
  AUTH_TOKEN_SECRET: local-cluster-only-auth-token-secret-0123456789
  # Bearer token for GET /api/metrics; the ServiceMonitor sends the same value.
  METRICS_TOKEN: local-cluster-only-metrics-token
