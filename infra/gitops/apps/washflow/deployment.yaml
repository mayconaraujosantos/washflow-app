apiVersion: apps/v1
kind: Deployment
metadata:
  name: washflow-api
  labels:
    app.kubernetes.io/name: washflow-api
    app: washflow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: washflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: washflow-api
        # Alloy's `app` log label (and the Grafana links) key on this name.
        app: washflow-api
    spec:
      initContainers:
        # Copies the OpenTelemetry Java agent into a shared volume; the app's
        # JVM loads it through JAVA_TOOL_OPTIONS - no change to the image.
        - name: otel-agent
          image: curlimages/curl:8.11.1
          args:
            - --fail
            - --silent
            - --show-error
            - --location
            - --output
            - /otel/opentelemetry-javaagent.jar
            - https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.33.0/opentelemetry-javaagent.jar
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
      containers:
        - name: washflow-api
          # `make image-local` builds this image with Podman (which prefixes
          # "localhost/") and loads it into the kind node; it is never pulled.
          image: localhost/washflow-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7000
          envFrom:
            - secretRef:
                name: washflow
          env:
            - name: PORT
              value: "7000"
            - name: APP_ENV
              value: development
            - name: DB_HOST
              value: washflow-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: washflow
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Tracing: OTLP/HTTP to Tempo. Logs keep going to stdout (Alloy ships
            # them) and metrics stay on /api/metrics (Prometheus scrapes them).
            - name: JAVA_TOOL_OPTIONS
              value: -javaagent:/otel/opentelemetry-javaagent.jar
            - name: OTEL_SERVICE_NAME
              value: washflow-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=local,k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME)
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
              readOnly: true
      volumes:
        - name: otel-agent
          emptyDir: {}
