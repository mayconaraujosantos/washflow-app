# Argo CD Image Updater: watches the local registry and points the washflow
# Application at the newest image CI pushed (no "bump the tag" commits).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 1.3.2
      helm:
        releaseName: argocd-image-updater
        valueFiles:
          - $values/infra/gitops/infrastructure/argocd-image-updater/values.yaml
    # The ImageUpdater resource (its CRD comes with the chart above).
    - repoURL: https://github.com/mayconaraujosantos/washflow-app.git
      targetRevision: develop
      ref: values
      path: infra/gitops/infrastructure/argocd-image-updater/config
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The ImageUpdater CRD and the resource using it arrive in the same sync.
      - SkipDryRunOnMissingResource=true
