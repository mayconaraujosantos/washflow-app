# PostgreSQL for SonarQube. Synced by bootstrap/applications/sonarqube.yaml
# together with the SonarQube chart; wave -1 so the database exists first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"
resources:
  - secret.yaml
  - service.yaml
  - statefulset.yaml
