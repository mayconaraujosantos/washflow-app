# Local-cluster credentials only - never reuse these values outside kind.
apiVersion: v1
kind: Secret
metadata:
  name: sonarqube-postgres
type: Opaque
stringData:
  username: sonarqube
  password: sonarqube-local
  # Read by the SonarQube chart (monitoringPasscodeSecretName) for its probes.
  monitoring-passcode: sonarqube-local-monitoring
