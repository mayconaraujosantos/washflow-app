# Argo CD Image Updater (chart argo/argocd-image-updater 1.3.2).
config:
  registries:
    # Images are named localhost:30500/... (the address the kind node pulls
    # from); the updater, running in a pod, reads the same registry through
    # its Service instead.
    - name: local
      prefix: localhost:30500
      api_url: http://registry.registry.svc.cluster.local:5000
      ping: true
      insecure: true
      default: false
