# Loki (chart 7.5.0) as a single binary with chunks and index on a local
# PersistentVolume (filesystem storage) - no object store needed locally.
# To try S3-compatible storage instead, set loki.storage.type: s3 and
# minio.enabled: true (the chart bundles MinIO for that).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: standard
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# The scalable targets must be zero in SingleBinary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Grafana talks to the "loki" Service directly; no gateway, caches or canary needed.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
