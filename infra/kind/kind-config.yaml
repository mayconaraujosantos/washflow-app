kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: washflow-local
nodes:
  - role: control-plane
    # ingress-nginx NodePorts (infra/gitops/infrastructure/ingress-nginx/values.yaml).
    # Every UI is reached through them by host name: http://<name>.local:8880
    # (argocd, grafana, sonarqube, washflow). Rootless Podman cannot bind host
    # ports below 1024, hence 8880/8443 instead of 80/443.
    # Port mappings are fixed at creation: `make cluster-down && make cluster-up`
    # after changing them.
    extraPortMappings:
      - containerPort: 30880
        hostPort: 8880
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
