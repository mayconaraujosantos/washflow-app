apiVersion: apps/v1
kind: Deployment
metadata:
  name: washflow-api
  labels:
    app: washflow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: washflow-api
  template:
    metadata:
      labels:
        app: washflow-api
    spec:
      containers:
        - name: washflow-api
          image: washflow-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
