services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: washflow
      POSTGRES_USER: washflow
      POSTGRES_PASSWORD: washflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U washflow -d washflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Caixa de e-mail falsa para desenvolvimento: recebe tudo o que o app envia por SMTP
  # (porta 1025) e mostra em http://localhost:8025. Nada sai para a internet.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  washflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: washflow-api:local
    ports:
      - "7000:7000"
    environment:
      PORT: 7000
      APP_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: washflow
      DB_USER: washflow
      DB_PASSWORD: washflow
      EMAIL_CHANNEL: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURITY: none
      SMTP_FROM: nao-responda@washflow.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
