services:
  washflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: washflow-api:local
    ports:
      - "7000:8080"
    environment:
      PORT: 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
