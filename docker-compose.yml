services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: washflow
      POSTGRES_USER: washflow
      POSTGRES_PASSWORD: washflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U washflow -d washflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  washflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: washflow-api:local
    ports:
      - "7000:7000"
    environment:
      PORT: 7000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: washflow
      DB_USER: washflow
      DB_PASSWORD: washflow
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
