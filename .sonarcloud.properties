# SonarCloud Automatic Analysis reads this file and ignores the sonar { } block in
# build.gradle.kts - keep both in sync. Only the Java and TypeScript sources are analyzed:
# the Flyway migrations are PostgreSQL, and the automatic analysis would read them as
# Oracle PL/SQL (VARCHAR2...).
sonar.sources=src/main/java,web/src
sonar.tests=src/test/java,web/src
sonar.test.inclusions=src/test/java/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**
sonar.exclusions=src/main/resources/db/migration/**,web/dist/**,web/node_modules/**,web/coverage/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**
